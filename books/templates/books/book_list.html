<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>

    <style>

    </style>
</head>
<body>

    <h1>Books Market</h1>

    <!-- search form -->
    <form method="GET" action="">
        <input type="text", name="q", placeholder="Book name or author name...", value="{{arama_kelimesi}}">
    <button type="submit">Search</button>
        {% if arama_kelimesi %}
            <button type="submit"><a href="{% url 'book-list-web' %}">Clear</a></button>
        {% endif %}
    </form>

    <hr>    
    {% for book in books %}
        <div class="book-cart">
            <h2>{{book.title}}</h2>
            <p><strong>Author:</strong>{{book.author}}</p>
            <p><strong>Category:</strong>{{book.category.name}}</p>
            <p class="price">Price: {{book.price}} TL</p>
        </div>
    {% empty %}        
        <p>There is no a book in the database</p>
    {% endfor %}       
</body>
</html>
